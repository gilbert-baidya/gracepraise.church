name: Playwright E2E Tests

on:
  push:
    branches: [ main, automation-playwright ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 25 }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
    env:
      CI: true
      PLAYWRIGHT_SUITE: ${{ github.event_name == 'schedule' && 'nightly' || 'pr' }}
      PRODUCTION_BASE_URL: http://127.0.0.1:8082
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shardIndex }}.zip
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install chromium webkit firefox --with-deps

    - name: Test prayer backend deduplication
      if: matrix.shardIndex == 1
      run: npm run test:prayer

    - name: Validate suite selection
      if: matrix.shardIndex == 1
      run: node --test tests/ci-selection.test.mjs tests/ci-sharding.test.mjs
      
    - name: Start local HTTP server
      run: |
        npm run build:production
        python3 -m http.server 8080 &
        python3 -m http.server 8082 --directory public-build &
        
    - name: Wait for server to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://127.0.0.1:8080; do sleep 1; done'
        timeout 30 bash -c 'until curl -f http://127.0.0.1:8082; do sleep 1; done'
        
    - name: Run Playwright tests (Shard ${{ matrix.shardIndex }}/4)
      run: node scripts/run-playwright-ci.mjs --shard=${{ matrix.shardIndex }}/4 --global-timeout=${{ github.event_name == 'schedule' && '3000000' || '1200000' }}
        
    - name: Upload blob report to GitHub Actions Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Download all blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
        
    - name: Merge reports into HTML
      run: npx playwright merge-reports --reporter html ./all-blob-reports
      
    - name: Upload merged HTML report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
