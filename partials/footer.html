<!-- Footer Accordion (Mobile) -->
<script>
    (function () {
        'use strict';
        const isMobile = () => window.innerWidth <= 768;

        document.querySelectorAll('.footer-accordion-toggle').forEach(btn => {
            btn.addEventListener('click', () => {
                if (!isMobile()) return;
                const accordion = btn.closest('.footer-accordion');
                const expanded = btn.getAttribute('aria-expanded') === 'true';
                btn.setAttribute('aria-expanded', !expanded);
                accordion.classList.toggle('expanded', !expanded);
            });
        });

        // On resize to desktop, expand all
        window.addEventListener('resize', () => {
            if (!isMobile()) {
                document.querySelectorAll('.footer-accordion').forEach(a => {
                    a.classList.remove('expanded');
                    a.querySelector('.footer-accordion-toggle')?.setAttribute('aria-expanded', 'false');
                });
            }
        });
    })();
</script>
