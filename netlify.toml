[build]
  publish = "."
  
[build.environment]
  NODE_VERSION = "18"

# Only build on production branch
[context.production]
  publish = "."

# Don't auto-publish on every commit - save credits
[context.deploy-preview]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://code.jquery.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://script.google.com https://www.google.com https://www.gstatic.com https://identity.netlify.com https://unpkg.com https://translate.google.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: blob: https:; media-src 'self' https://player.vimeo.com https://*.vimeocdn.com https://vimeo.com; frame-src 'self' https://player.vimeo.com https://www.youtube.com https://buy.stripe.com https://www.paypal.com; connect-src 'self' https://script.google.com https://www.gstatic.com https://*.firebaseio.com https://*.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self' https://script.google.com;"

# Optimize image handling
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/daily-devotion/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
