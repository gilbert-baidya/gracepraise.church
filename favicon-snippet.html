<!-- Favicon Package - Add this to the <head> section of all HTML pages -->

<!-- Standard favicon -->
<link rel="icon" type="image/svg+xml" href="/images/logo/gpbc-no-name.svg">
<link rel="alternate icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32x32.png">
<link rel="alternate icon" type="image/png" sizes="16x16" href="/images/favicons/favicon-16x16.png">

<!-- Apple Touch Icon -->
<link rel="apple-touch-icon" sizes="180x180" href="/images/favicons/apple-touch-icon.png">

<!-- Android Chrome -->
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicons/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/images/favicons/android-chrome-512x512.png">

<!-- Web App Manifest -->
<link rel="manifest" href="/images/favicons/site.webmanifest">

<!-- Microsoft Tiles -->
<meta name="msapplication-TileColor" content="#2b5797">
